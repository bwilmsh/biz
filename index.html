<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Outreach HQ</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;800&display=swap">
<style>
:root{--bg:#0A0A08;--ink:#F3EEE6;--mute:#A89F90;--or:#FF7A2F;--glass:rgba(255,255,255,.06);--gl:rgba(255,255,255,.13);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 Manrope,system-ui,sans-serif}
.bg{position:fixed;inset:0;z-index:-1;background:radial-gradient(60% 50% at 50% 26%,rgba(214,140,60,.5),transparent 70%),radial-gradient(45% 45% at 12% 85%,rgba(80,92,44,.55),transparent 70%),radial-gradient(40% 40% at 90% 70%,rgba(120,70,30,.35),transparent 70%),linear-gradient(#17130d,#0a0a08);background-size:cover;background-position:center}
.bg.ph::after{content:'';position:absolute;inset:0;background:linear-gradient(rgba(8,8,6,.4),rgba(8,8,6,.82))}
.app{display:grid;grid-template-columns:64px 1fr;gap:24px;padding:20px;max-width:1400px;margin:0 auto}
.rail{display:flex;flex-direction:column;gap:10px;align-items:center;padding:12px 8px;background:var(--glass);border:1px solid var(--gl);border-radius:32px;height:fit-content;position:sticky;top:20px;backdrop-filter:blur(18px)}
.rail button,.rail label{width:42px;height:42px;border-radius:50%;border:0;background:none;color:var(--mute);cursor:pointer;display:grid;place-items:center}
.rail [aria-current=true]{background:#fff;color:#111}.rail button:hover,.rail label:hover{color:#fff}
.rail .logo{background:var(--or);color:#111;font-weight:800;font-size:18px}
:focus-visible{outline:2px solid var(--or);outline-offset:2px}
.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:8px}
.me{display:flex;align-items:center;gap:10px;font-size:13px}.av{width:38px;height:38px;border-radius:50%;background:var(--or);color:#111;display:grid;place-items:center;font-weight:800}
.hero{text-align:center;padding:22px 0 34px}.hero h1{font:600 22px Manrope;margin:0 0 8px}
#cap{width:min(100%,560px);background:none;border:0;border-bottom:1px solid var(--gl);color:var(--ink);font:500 28px Manrope;text-align:center;padding:6px;outline:0}
#cap::placeholder{color:var(--mute)}#cap:focus{border-color:var(--or)}
.grid{display:grid;grid-template-columns:repeat(3,1fr) 1.15fr;gap:16px}.g{grid-column:4;grid-row:1/span 2}.w2{grid-column:span 2}
.tile{background:var(--glass);border:1px solid var(--gl);border-radius:24px;padding:18px;backdrop-filter:blur(18px);min-width:0}
.th{display:flex;align-items:center;gap:12px;margin-bottom:16px;font-weight:600}.th small{margin-left:auto;color:var(--mute);font-size:11px;font-weight:400}
.ico{width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.1);display:grid;place-items:center;flex:none}
.big{font:800 38px/1 Manrope;letter-spacing:-.02em}.or{color:var(--or)}.mu{color:var(--mute);font-size:13px}
.dm{display:flex;gap:10px;align-items:flex-end;margin:16px 0 6px}.dm div,.cols div{display:flex;flex-direction:column-reverse;gap:4px;align-items:center;font-size:11px;color:var(--mute)}
.dm i{width:11px;height:11px;border-radius:3px;background:rgba(255,255,255,.12)}.dm i.on{background:var(--or);transform:scale(0);transition:transform .4s var(--d)}.go .dm i.on{transform:none}
.cols{display:flex;gap:10px;align-items:flex-end;margin-top:14px}.cols b{display:block;width:16px;border-radius:5px;background:#F2B544;transform:scaleY(0);transform-origin:bottom;transition:transform .8s cubic-bezier(.2,.7,.2,1) var(--d)}.go .cols b{transform:none}
svg{display:block;width:100%}.ln{fill:none;stroke:var(--or);stroke-width:2.5;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset 2s ease}.go .ln{stroke-dashoffset:0}.ln.b{stroke:#F3EEE6;opacity:.7}
.tk{stroke:rgba(255,255,255,.2);stroke-width:3;stroke-linecap:round;transition:stroke .3s var(--d)}.go .tk.lit{stroke:var(--or)}
.nd{transform-origin:150px 150px;transform:rotate(-90deg);transition:transform 1.8s cubic-bezier(.2,.8,.2,1)}.go .nd{transform:rotate(var(--a))}
.sv{display:flex;gap:8px;justify-content:center;margin-bottom:12px}.sc{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;font:800 12px Manrope;border:0;text-decoration:none;cursor:pointer}
.row3{display:flex;justify-content:space-between;margin-top:14px;text-align:center}.row3 b{display:block;font-size:22px}
.t2{display:flex;gap:10px;align-items:center;padding:6px 0;cursor:pointer}.t2 input{accent-color:var(--or);width:17px;height:17px}.t2 input:checked+span{text-decoration:line-through;color:var(--mute)}
.btn{border:0;border-radius:99px;background:var(--or);color:#111;padding:10px 20px;font:700 14px Manrope,sans-serif;cursor:pointer;text-decoration:none;display:inline-block}.btn.t{background:none;color:var(--or);padding:4px 0}.btn.g2{background:rgba(255,255,255,.12);color:var(--ink)}
.ed{font:inherit;color:inherit;background:none;border:0;border-bottom:1px dashed transparent;border-radius:0;padding:0;margin:0;outline:0;max-width:100%}.ed:hover{border-color:var(--gl)}.ed:focus{border-color:var(--or)}
select.ed{cursor:pointer}option{color:#111}textarea.ed{width:100%;min-height:130px;border:1px solid var(--gl);border-radius:14px;padding:12px;resize:vertical}
h2{font:800 clamp(30px,5vw,52px)/1.05 Manrope;letter-spacing:-.03em;margin:6px 0 20px}
.rw{display:grid;grid-template-columns:2fr 1fr 1fr 1fr auto;gap:8px 18px;align-items:center;padding:13px 0;border-bottom:1px solid var(--gl)}.rw:last-child{border:0}
.rw.c5{grid-template-columns:2fr repeat(4,1fr)}
form{display:flex;gap:14px 22px;flex-wrap:wrap;align-items:end;margin-bottom:18px}form label{display:grid;gap:2px;font-size:12px;color:var(--mute)}form .ed{font-size:16px;color:var(--ink);border-bottom:1px solid var(--gl)}
.svr{padding:18px 0;border-bottom:1px solid var(--gl);display:grid;gap:8px}.svr:last-child{border:0}
.svr .nm{font:800 28px Manrope;display:flex;align-items:center;gap:12px;flex-wrap:wrap}.dot{width:14px;height:14px;border-radius:50%;background:var(--c)}
.meta{display:flex;gap:8px 28px;flex-wrap:wrap;font-size:13px;color:var(--mute)}.meta .ed{color:var(--ink);font-size:15px}
.imp{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.cal{grid-column:1/-1}.cw{display:grid;grid-template-columns:2fr 1fr;gap:28px}
.rv{opacity:0;transform:translateY(40px) scale(.97);transition:opacity .8s,transform .8s cubic-bezier(.2,.7,.2,1);transition-delay:var(--rd,0s)}.rv.in{opacity:1;transform:none}
#prog{position:fixed;top:0;left:0;height:3px;width:0;background:var(--or);z-index:30}
#trk,#cfg{position:fixed;inset:0;z-index:95;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.55);backdrop-filter:blur(6px);padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px))}#trk.open,#cfg.open{display:flex}
.trb{width:min(540px,100%);background:rgba(20,17,12,.96);border:1px solid var(--gl);border-radius:24px;padding:20px;max-height:100%;overflow:auto}
.chips button[aria-pressed=true]{background:var(--or);color:#111;border-color:var(--or)}#ftr{margin:14px 0 0}
.app>div{min-width:0}.app{overflow-x:clip}
.th{flex-wrap:wrap}.th .tt{font-weight:600}.th small .ed{font-size:11px;color:var(--mute)}.tb{display:flex;gap:6px;margin-left:8px}
.ib{width:30px;height:30px;border-radius:50%;border:1px solid var(--gl);background:rgba(255,255,255,.06);color:var(--ink);display:grid;place-items:center;cursor:pointer;padding:0}.ib:hover{border-color:var(--or);color:var(--or)}
.pb{height:6px;border-radius:3px;background:rgba(255,255,255,.12);margin:10px 0 4px;overflow:hidden}.pb i{display:block;height:100%;background:var(--or);border-radius:3px;transition:width 1s}
.cff{display:grid;gap:16px}.cff label{display:grid;gap:4px;font-size:13px;color:var(--mute)}.cff .ed{font-size:18px;color:var(--ink);border-bottom:1px solid var(--gl)}
.svr,.svr .nm,.meta{min-width:0}.svr{grid-template-columns:minmax(0,1fr)}.svr .nm>*,.meta>*{min-width:0;max-width:100%}.svr input,.meta input{max-width:100%}.svr .nm .ed{min-width:0;width:auto}
@media(max-width:700px){body .app{grid-template-columns:minmax(0,1fr)}body .rail{flex-wrap:wrap}body .rail button,body .rail label{width:38px;height:38px}}
#ai{position:fixed;top:0;right:0;bottom:0;width:min(420px,100vw);z-index:90;background:rgba(16,14,10,.94);backdrop-filter:blur(22px);border-left:1px solid var(--gl);display:flex;flex-direction:column;padding:calc(16px + env(safe-area-inset-top,0px)) 18px calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(105%);visibility:hidden;transition:transform .45s cubic-bezier(.2,.8,.2,1),visibility 0s .45s}
#ai.open{transform:none;visibility:visible;transition:transform .45s cubic-bezier(.2,.8,.2,1)}
.aih{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;margin-bottom:10px}.aih .btn{margin-left:auto}
#aim{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:6px 2px}
.mg{max-width:88%;padding:10px 14px;border-radius:16px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px}.mg.u{align-self:flex-end;background:var(--or);color:#111}.mg.a{align-self:flex-start;background:rgba(255,255,255,.09)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}.chips button{border:1px solid var(--gl);background:none;color:var(--ink);border-radius:99px;padding:6px 12px;font:500 12px Manrope,sans-serif;cursor:pointer}.chips button:hover{border-color:var(--or)}
.aif{display:flex;gap:8px}.aif input{flex:1;min-width:0;background:rgba(255,255,255,.08);border:1px solid var(--gl);border-radius:99px;color:var(--ink);padding:10px 16px;font:inherit;outline:0}.aif input:focus{border-color:var(--or)}
@media(prefers-reduced-motion:reduce){.rv{opacity:1!important;transform:none!important;transition:none!important}#ai{transition:none!important}}
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.ch{font-size:11px;color:var(--mute);text-align:center}
.cd{min-height:66px;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid transparent;padding:6px;text-align:left;color:inherit;font:inherit;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-width:0}
.cd:hover{background:rgba(255,255,255,.1)}.cd.td{border-color:var(--or)}.cd.sel{background:rgba(255,122,47,.24)}
.cd b{font-size:13px}.cd span{font-size:11px;color:var(--mute)}.cd .bk{color:#111;background:var(--or);border-radius:99px;padding:0 7px;align-self:flex-start;font-weight:700}
@media(max-width:900px){.cw{grid-template-columns:1fr}}@media(max-width:700px){.cd{min-height:54px;padding:4px}.cd span{font-size:9px}}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#fff;color:#111;padding:10px 20px;border-radius:99px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .2s;z-index:200}.toast.show{opacity:1}
#ov{position:fixed;inset:0;z-index:100;overflow-y:auto;scroll-snap-type:y mandatory;background:#0E0D0A;color:#fff;display:none}#ov.open{display:block}
.sl{height:100vh;height:100dvh;scroll-snap-align:start;display:flex;align-items:center;padding:calc(70px + env(safe-area-inset-top,0px)) clamp(20px,8vw,120px) 40px;background:var(--b2,#0E0D0A)}
.sl h2{font-size:clamp(46px,10vw,130px);margin:0 0 20px}.sl p{font-size:clamp(18px,2.4vw,28px);margin:0 0 20px;max-width:30ch}
.sl .big{font-size:clamp(40px,8vw,100px);margin-bottom:20px}.sl small{font-size:.35em;font-weight:500;opacity:.8}
.sl ul{list-style:none;padding:0;margin:0 0 24px;font-size:clamp(18px,2.2vw,26px)}.sl li{margin-bottom:8px}.sl .btn{background:#fff;color:#111}
.sl .ed{color:#fff;font:800 clamp(40px,9vw,110px)/1 Manrope;border-bottom:2px dashed rgba(255,255,255,.4);width:100%}
.sl .a>*{opacity:0;transform:translateY(34px);transition:opacity .7s,transform .7s}.sl.in .a>*{opacity:1;transform:none}
.sl.in .a>:nth-child(2){transition-delay:.12s}.sl.in .a>:nth-child(3){transition-delay:.24s}.sl.in .a>:nth-child(4){transition-delay:.36s}
.x{position:fixed;top:calc(16px + env(safe-area-inset-top,0px));right:22px;z-index:101;background:rgba(255,255,255,.15);color:#fff;border:0;border-radius:99px;padding:9px 18px;font:600 14px Manrope,sans-serif;cursor:pointer}
@media(max-width:1000px){.grid{grid-template-columns:1fr 1fr}.g{grid-column:auto;grid-row:auto}}
@media(max-width:700px){.app{grid-template-columns:1fr;padding:12px}.rail{flex-direction:row;position:sticky;top:8px;z-index:10;justify-content:center;padding:8px}.grid{grid-template-columns:1fr}.w2{grid-column:auto}.rw,.rw.c5{grid-template-columns:1fr 1fr}}
@media(prefers-reduced-motion:reduce){.dm i.on,.cols b,.ln,.tk,.nd,.sl .a>*{transition:none!important;transform:none!important;opacity:1!important;stroke-dashoffset:0!important}.nd{transform:rotate(var(--a))!important}.tk.lit{stroke:var(--or)}}
</style>
</head>
<body>
<div class="bg" id="bg"></div>
<div id="prog"></div>
<div id="trk" role="dialog" aria-modal="true" aria-label="Track something"><div class="trb"><div class="aih">Track something<button type="button" class="btn g2" id="trx">Close</button></div><div class="chips" id="trt"></div><form id="ftr"></form></div></div>
<div id="cfg" role="dialog" aria-modal="true" aria-label="Settings"><div class="trb"><div class="aih"><span id="cft">Settings</span><button type="button" class="btn g2" id="cfx">Done</button></div><div id="cfb"></div></div></div>
<aside id="ai" role="dialog" aria-label="AI help"><div class="aih"><span class="ico"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="width:18px"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8zM19 16l.8 2.2L22 19l-2.2.8L19 22l-.8-2.2L16 19l2.2-.8z"/></svg></span>AI help<button class="btn g2" id="aix">Close</button></div><div id="aim" aria-live="polite"></div><div class="chips" id="aic"></div><div class="aif"><input id="aiq" placeholder="Ask about your dashboard or outreach" aria-label="Ask AI help" autocomplete="off"><button class="btn" id="ais">Send</button></div></aside>
<div class="app" id="app"></div>
<div id="ov" role="dialog" aria-label="Customer presentation"></div>
<div class="toast" id="toast" role="status"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
const PAL=['#0F8B8D','#C9731F','#4C6FB5','#A5528B','#5F9433','#B84A4A'],ST=['Lead','Active','Paused'],OUT=['To call','No answer','Call back','Booked','Not interested'];
const sv=(i,n,p,t,b,r,u)=>({id:'s'+i,n,p,t,b,r,u:u===undefined?'/month':u,link:'',col:PAL[i-1]});
const DEF={name:'',role:'',agency:'',client:'',goal:0,target:0,bg:'',script:'',
week:{sent:[0,0,0,0,0,0,0],replies:[0,0,0,0,0,0,0],booked:[0,0,0,0,0,0,0],calls:[0,0,0,0,0,0,0]},
svcs:[sv(1,'',0,'','','','')],
clients:[],calls:[],camps:[],tasks:[],earned:[],gb:0,gs:0,
lb:{out:{t:'Outreach',s:'Last 7 days'},calls:{t:'Cold calls',s:'Last 7 days'},booked:{t:'Calls booked',s:'Last 7 days'},gauge:{t:'Monthly revenue goal',s:'This month'},ov:{t:'Overview',s:'Your numbers'},tasks:{t:'Today’s tasks',s:''},cal:{t:'Calendar',s:'Calls made and booked calls'}}};
try{localStorage.removeItem('ohq3');localStorage.removeItem('ohq4')}catch(e){}
let D;try{D=JSON.parse(localStorage.getItem('ohq5'))||structuredClone(DEF)}catch(e){D=structuredClone(DEF)}
const $=s=>document.querySelector(s),save=()=>{try{localStorage.setItem('ohq5',JSON.stringify(D))}catch(e){toast('Could not save on this device')}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fm=(n,f)=>f==='$'?'$'+(+n).toLocaleString('en-US'):f==='%'?n+'%':(+n).toLocaleString('en-US');
const url=l=>l?(/^https?:\/\//i.test(l)?l:'https://'+l):'',pct=(a,b)=>b?Math.round(a/b*100):0,sc=id=>{const s=D.svcs.find(x=>x.id===id);return s?{...s,n:s.n||'Untitled service'}:{n:'Removed service',col:'#888'}},sum=a=>a.reduce((x,y)=>x+y,0);
const getP=p=>p.split('.').reduce((o,k)=>o[k],D);
function setP(p,v){const k=p.split('.'),l=k.pop(),o=k.reduce((x,y)=>x[y],D);if(Array.isArray(o[l]))o[l]=Array.from({length:7},(_,i)=>parseFloat(String(v).split(',')[i])||0);else o[l]=typeof o[l]==='number'?(parseFloat(String(v).replace(/[^0-9.]/g,''))||0):v}
const ed=(p,v,c,ph)=>`<input class="ed ${c||''}" data-p="${p}" value="${esc(v==null||v===0?'':v)}" size="${Math.max(3,String(v==null||v===0?'':v||ph||'').length+1)}" placeholder="${ph||''}" aria-label="${ph||p}">`;
const sel=(p,v,o)=>`<select class="ed" data-p="${p}" aria-label="${p}">${o.map(([k,l])=>`<option value="${k}" ${k==v?'selected':''}>${esc(l)}</option>`).join('')}</select>`;
const IC={home:'<path d="M3 11l9-8 9 8M5 10v10h5v-6h4v6h5V10"/>',users:'<path d="M16 21v-2a4 4 0 00-4-4H6a4 4 0 00-4 4v2M9 11a4 4 0 100-8 4 4 0 000 8M22 21v-2a4 4 0 00-3-3.9M16 3.1a4 4 0 010 7.8"/>',phone:'<path d="M22 16.9v3a2 2 0 01-2.2 2 19.8 19.8 0 01-8.6-3.1 19.5 19.5 0 01-6-6A19.8 19.8 0 012.1 4.2 2 2 0 014.1 2h3a2 2 0 012 1.7c.1 1 .4 1.9.7 2.8a2 2 0 01-.5 2.1L8.1 9.9a16 16 0 006 6l1.3-1.3a2 2 0 012.1-.4c.9.3 1.8.6 2.8.7a2 2 0 011.7 2z"/>',send:'<path d="M22 2L11 13M22 2l-7 20-4-9-9-4z"/>',grid:'<path d="M3 3h7v7H3zM14 3h7v7h-7zM14 14h7v7h-7zM3 14h7v7H3z"/>',img:'<path d="M3 5h18v14H3zM3 16l5-5 5 5 3-3 5 5"/>',chk:'<path d="M4 12l5 5L20 6"/>',sl:'<path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/>',plus:'<path d="M12 5v14M5 12h14"/>',spark:'<path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8zM19 16l.8 2.2L22 19l-2.2.8L19 22l-.8-2.2L16 19l2.2-.8z"/>'};
const ic=n=>`<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="width:18px">${IC[n]}</svg>`;
const num=(n,f)=>`<span class="num" data-n="${n}" data-f="${f||''}">${fm(n,f)}</span>`;
const sm=(v,w,h,mx)=>{const p=v.map((n,i)=>[i*w/(v.length-1),h-n/mx*h*.85-4]);return p.map((q,i)=>i?`C${(p[i-1][0]+q[0])/2} ${p[i-1][1]} ${(p[i-1][0]+q[0])/2} ${q[1]} ${q[0]} ${q[1]}`:`M${q[0]} ${q[1]}`).join('')};
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),2200)}
let view='Home';const VW=[['Home','home'],['Clients','users'],['Calls','phone'],['Outreach','send'],['Services','grid']];
